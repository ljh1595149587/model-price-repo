name: Sync Model Pricing

on:
  push:
    branches: [main]
    paths: [custom_models.json, scripts/merge.py, .github/workflows/sync.yml]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

concurrency:
  group: sync-pricing
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge upstream with custom models
        id: merge
        run: |
          output=$(python3 scripts/merge.py)
          echo "$output"
          echo "changed=$(echo "$output" | grep -oP 'CHANGED=\K(true|false)')" >> "$GITHUB_OUTPUT"
          echo "hash=$(echo "$output" | grep -oP 'HASH=\K\S+')" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.merge.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model_prices_and_context_window.json model_prices_and_context_window.sha256
          git commit -m "chore: sync model pricing ($(echo '${{ steps.merge.outputs.hash }}' | cut -c1-8))"
          git push
